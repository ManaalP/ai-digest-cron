name: Weekly AI Digest

on:
  schedule:
    # 7:13 AM UTC every Sunday (12:43 PM IST Sunday). Off the hour to avoid runner congestion.
    - cron: "13 7 * * 0"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test remotely

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          PROVIDER_PRIORITY: ${{ vars.PROVIDER_PRIORITY || 'google,anthropic,openai' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL || 'gemini-3.6-flash' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: "28"
          MAX_ARTICLES_PER_RUN: "15"
        run: python main.py

      - name: Commit and push updated web app & seed dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seed_7days.json index.html
          git diff --staged --quiet || (git commit -m "Auto-update weekly AI digest and web app [skip ci]" && git push || echo "Push skipped or branch protected")

