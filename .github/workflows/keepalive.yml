name: Keepalive

# GitHub auto-disables `schedule:` triggers on a repo with no commits in 60
# days. This workflow makes a trivial commit every 45 days so the daily
# digest workflow never gets silently switched off. Safe to remove if you
# know you'll be pushing to this repo regularly anyway.

on:
  schedule:
    - cron: "0 3 1 * *"   # 3 AM UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          mkdir -p .github
          date -u +"Last keepalive commit: %Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
      - name: Commit if changed
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/.keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
