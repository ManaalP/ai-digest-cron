<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0d0f12"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Neural nodes & pulse waveform -->
  <path d="M12 34 L22 34 L28 18 L36 48 L42 28 L48 34 L54 34" stroke="url(#pulseGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="28" cy="18" r="3.5" fill="#3b82f6"/>
  <circle cx="36" cy="48" r="3.5" fill="#10b981"/>
  <circle cx="42" cy="28" r="3" fill="#60a5fa"/>
</svg>
